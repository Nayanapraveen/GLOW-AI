<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glow AI</title>
<style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
           background: url('https://images.unsplash.com/photo-1612817288484-6f916006741a') no-repeat center center/cover;
            height: 100vh;
            color: white;
        }

        .overlay {
            background: rgba(0,0,0,0.5);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 30px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: #ff4d6d;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff1e4d;
        }

        .logo {
            font-size: 20px;
            position: absolute;
            top: 20px;
            left: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="logo">GlowAI ✨</div>

<div class="overlay">
    <div class="container">
        <h1>Glow AI</h1>
        <p>Discover the right ingredients for your beauty</p>

        <a href="/login">
            <button class="btn">Get Started</button>
        </a>

        <br>

        <a href="/register">
            <button class="btn">Create Account</button>
        </a>
    </div>
</div>

</body>
</html>
