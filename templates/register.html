<!DOCTYPE html>
<html>
<head>
    <title>Register | AI Skincare System</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            color: white;
        }

        .register-card h2 {
            margin-bottom: 30px;
            font-weight: 600;
        }

        .register-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .register-card button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #11998e;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-card button:hover {
            background: #ddd;
            transform: scale(1.03);
        }

        .login-link {
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h2>Create Account</h2>
    {% if error %}
        <p style="color: #ffcccc; font-size: 14px;">{{ error }}</p>
    {% endif %}


    <form method="POST">
        <input type="text" name="username" placeholder="Choose Username" required>
        <input type="password"
       name="password"
       placeholder="Choose Password"
       minlength="8"
       required>

<small style="color:#f8f8f8; display:block; text-align:left; margin-top:-5px; margin-bottom:10px;">
Password must be at least 8 characters long and contain one uppercase letter, one lowercase letter, one number, and one special character.
</small>
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>
        <button type="submit">Register</button>
    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login">Login</a>
    </div>
</div>

</body>
</html>
