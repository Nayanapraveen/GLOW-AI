<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Quiz</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    display: flex;
    justify-content: center;
    padding: 40px;
}

.container {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 15px;
    width: 450px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.question {
    margin-bottom: 15px;
}

label {
    font-weight: 500;
}

select {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-top: 5px;
}

button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(45deg, #6a11cb, #2575fc);
    border: none;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 20px;
    font-size: 16px;
}

button:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="container">
<h2>Find Your Skin Type</h2>

<form action="/skin_quiz" method="POST">

<div class="question">
<label>1. After washing, how does your skin feel?</label>
<select name="q1">
<option value="oily">Oily</option>
<option value="dry">Dry</option>
</select>
</div>

<div class="question">
<label>2. How often does your face get shiny?</label>
<select name="q2">
<option value="oily">Very often</option>
<option value="dry">Rarely</option>
</select>
</div>

<div class="question">
    <label>3. Do you notice flaky skin?</label>

    <select name="q3">
        <option value="dry">Frequently</option>
        <option value="normal">Occasionally</option>
        <option value="oily">Never</option>
    </select>
</div>

<div class="question">
    <label>4. How visible are your pores?</label>

    <select name="q4">
        <option value="oily">Very visible</option>
        <option value="normal">Slightly visible</option>
        <option value="dry">Hardly visible</option>
    </select>
</div>

<div class="question">
    <label>5. Does your makeup wear off quickly due to oiliness?</label>

    <select name="q5">
        <option value="oily">Yes</option>
        <option value="normal">Sometimes</option>
        <option value="dry">No</option>
    </select>
</div>

<div class="question">
    <label>6. How often do you get pimples?</label>

    <select name="q6">
        <option value="oily">Frequently</option>
        <option value="normal">Sometimes</option>
        <option value="dry">Rarely</option>
    </select>
</div>

<div class="question">
    <label>7. Does your skin become irritated easily?</label>

    <select name="q7">
        <option value="sensitive">Yes</option>
        <option value="normal">Sometimes</option>
        <option value="dry">No</option>
    </select>
</div>

<div class="question">
    <label>8. How does your skin feel during winter?</label>

    <select name="q8">
        <option value="dry">Extremely dry</option>
        <option value="normal">Normal</option>
        <option value="oily">Oily</option>
    </select>
</div>

<div class="question">
    <label>9. Which best describes your forehead and nose area?</label>

    <select name="q9">
        <option value="oily">Oily</option>
        <option value="normal">Balanced</option>
        <option value="dry">Dry</option>
    </select>
</div>

<div class="question">
    <label>10. How often do you use moisturizer?</label>

    <select name="q10">
        <option value="dry">Frequently</option>
        <option value="normal">Occasionally</option>
        <option value="oily">Rarely</option>
    </select>
</div>


<button type="submit">Analyze My Type</button>

</form>
</div>

</body>
</html>
