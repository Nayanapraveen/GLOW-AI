<!DOCTYPE html>
<html>
<head>
    <title>Login | AI Skincare System</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #8e2de2, #4a00e0);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            color: white;
        }

        .login-card h2 {
            margin-bottom: 30px;
            font-weight: 600;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #4a00e0;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-card button:hover {
            background: #ddd;
            transform: scale(1.03);
        }

        .register-link {
            margin-top: 15px;
            font-size: 14px;
        }

        .register-link a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Login</h2>
    {% if success %}
<p style="color: lightgreen; font-weight: bold;">
    {{ success }}
</p>
{% endif %}

    <form method="POST" action="{{ url_for('login') }}">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>
<p>
    <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
</p>
    <div class="register-link">
        Don't have an account?
        <a href="/register">Register</a>
    </div>
</div>

</body>
</html>
